[project]
name = "curator"
version = "0.1.0"
description = "Samsung Frame curation pipeline — catalog, analysis, approval, and rendering."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141",
    "imagehash>=4.3.2",
    "pillow>=12.3.0",
    "pillow-heif>=1.5.0",
    "pydantic-settings>=2.4.0",
    "uvicorn>=0.52",
]

[project.scripts]
curator = "curator.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/curator"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.mypy]
python_version = "3.13"
files = ["src"]
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
